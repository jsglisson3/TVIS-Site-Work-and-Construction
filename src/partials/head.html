<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Security: GitHub Pages can't send custom headers, so the safe parts of a content security policy go here.
     No <base> tag hijacks, no plugins, and any http:// file is fetched over https. Scripts are not restricted
     (the tracking tags in site.config.json load from Google and Meta). -->
<meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
{{verification_meta}}
{{canonical_tag}}
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
{{og_url_tag}}
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{name}}: a jobsite photo with the TVIS logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/BarlowCondensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/SourceSans3.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
{{structured_data}}
<!-- ===== Tracking: Google Analytics / Google Ads / Meta Pixel =====
     Fill the IDs in site.config.json > tracking and rebuild. Leads fire on form submit,
     call events fire when a phone link is tapped (see assets/site.js > track()). -->
{{tracking_head}}
