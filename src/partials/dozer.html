<!-- The TVIS dozer, side view, blade forward (it drives to the right). Colours come from --dz (body) and
     --dz-dark (glass, tracks, details), so it reads on the charcoal footer and on light pages alike.
     In the footer, site.js adds .go to the ground line once it scrolls into view and the dozer rolls in
     once (blade lowers as it arrives, tracks run, a gentle pitch, exhaust puffs, dust off the rear track, the heap grows,
     the blade and heap settle as it stops, then a faint idle puff now and then); with reduced motion it is simply parked.
     Elsewhere it stands still and the puffs stay hidden. -->
<svg class="dozer" viewBox="0 0 260 120" aria-hidden="true" focusable="false">
  <!-- everything rides in one group so the whole machine can pitch a touch while it rolls -->
  <g class="dz-rig">
  <g fill="var(--dz,#A3B654)">
    <!-- ripper -->
    <path d="M14 64h30v9H26l-6 40h-8l5-40h-3z"/>
    <!-- track frame -->
    <rect x="38" y="78" width="164" height="36" rx="18"/>
    <!-- cab with roof overhang -->
    <path d="M52 13h78v6h-6l-2 59H62l-6-59h-4z"/>
    <!-- engine hood, grille end forward -->
    <path d="M118 46h70l6 6v26h-76z"/>
    <!-- exhaust stack and air intake -->
    <rect x="146" y="28" width="7" height="20"/><rect x="143" y="25" width="13" height="5"/>
    <rect x="166" y="38" width="10" height="10"/>
  </g>
  <!-- push arm and blade: one group so the blade can settle down a touch when the dozer stops in the footer -->
  <g class="dz-blade">
    <g fill="var(--dz,#A3B654)">
      <path d="M150 88l62-6 2 9-62 6z"/>
      <path d="M208 32h14c9 16 13 34 13 54v26h-29z"/>
    </g>
    <g fill="var(--dz-dark,#232B2E)">
      <rect x="204" y="108" width="30" height="5"/>
      <path d="M188 58l26 4-1 4-26-4z"/>
    </g>
  </g>
  <g fill="var(--dz-dark,#232B2E)">
    <!-- cab glass with a glare stripe left in body colour -->
    <path d="M64 25h52l-2 40H70z"/>
    <!-- grille slats -->
    <rect x="182" y="54" width="4" height="20"/><rect x="176" y="54" width="3" height="20"/>
    <!-- track belly and rollers -->
    <rect x="47" y="86" width="146" height="20" rx="10"/>
  </g>
  <!-- a small TVIS on the engine hood, in the detail colour so it reads as a cut-in badge -->
  <text class="dz-badge" x="156" y="70.5" text-anchor="middle" font-family="Barlow Condensed, Barlow Condensed Fallback, Arial Narrow, Arial, sans-serif" font-weight="700" font-size="14" letter-spacing=".6" fill="#FF8200">TVIS</text>
  <path d="M74 30l10 0-12 30h-6z" fill="var(--dz,#A3B654)" opacity=".35"/>
  <g fill="var(--dz,#A3B654)">
    <circle cx="60" cy="96" r="11"/><circle cx="180" cy="96" r="10"/>
    <circle cx="90" cy="100" r="4.5"/><circle cx="113" cy="100" r="4.5"/><circle cx="136" cy="100" r="4.5"/><circle cx="158" cy="100" r="4.5"/>
  </g>
  <circle cx="60" cy="96" r="4" fill="var(--dz-dark,#232B2E)"/><circle cx="180" cy="96" r="3.5" fill="var(--dz-dark,#232B2E)"/>
  <!-- dirt heap in front of the blade (hidden unless rolling): two mounds that grow as the dozer pushes, four clods that
       tumble off the top, three low dust puffs at the cutting edge, and the whole heap gives as the blade settles -->
  <g class="dz-dirt" fill="var(--dz,#A3B654)">
    <path class="pile pile-back" d="M226 113c7-10 13-19 23-25 8 5 15 8 23 12 7 5 11 9 15 13z"/>
    <path class="pile pile-front" d="M231 113c5-7 10-13 17-17 6 3 11 5 17 8 5 4 8 6 10 9z"/>
    <ellipse class="dust" cx="236" cy="112" rx="7" ry="2.2"/><ellipse class="dust" cx="240" cy="112" rx="6" ry="2"/><ellipse class="dust" cx="238" cy="112" rx="6.5" ry="2.1"/>
    <circle class="clod" cx="250" cy="88" r="2.8"/><circle class="clod" cx="262" cy="93" r="2.2"/><circle class="clod" cx="246" cy="96" r="1.9"/><circle class="clod" cx="268" cy="100" r="2.1"/>
  </g>
  <!-- exhaust puffs: hidden unless the footer dozer is rolling -->
  <g class="dz-smoke" fill="var(--dz,#A3B654)">
    <circle class="puff" cx="149.5" cy="22" r="3.5"/><circle class="puff" cx="149.5" cy="22" r="3"/><circle class="puff" cx="149.5" cy="22" r="2.5"/>
    <!-- once parked, a faint idle puff every few seconds -->
    <circle class="puff-idle" cx="149.5" cy="23" r="2.6"/>
  </g>
  <!-- dust kicked up behind the rear track while rolling -->
  <g class="dz-tail" fill="var(--dz,#A3B654)">
    <ellipse class="tdust" cx="44" cy="110" rx="6" ry="2.2"/><ellipse class="tdust" cx="40" cy="111" rx="5" ry="1.9"/><ellipse class="tdust" cx="42" cy="110" rx="5.5" ry="2"/>
  </g>
  <rect class="track-run" x="41" y="81" width="158" height="30" rx="15" fill="none" stroke="var(--dz-dark,#232B2E)" stroke-width="3" stroke-dasharray="6 6"/>
  </g>
</svg>
