<!-- Site header: white, with the full-colour logo. Phone menu opens full screen with the phone number first. -->
<header class="hdr" data-hdr>
  <div class="hdr-in">
    <a class="hdr-logo" href="/" aria-label="{{name}}, home">
      <img class="logo-ink" src="/assets/img/logo.svg" alt="" width="1619" height="776" decoding="async">
    </a>
    <nav class="nav" aria-label="Main">
      <ul class="nav-list">
        <li><a href="/homeowners"{{nav_homeowners}}>Homeowners</a></li>
        <li><a href="/builders"{{nav_builders}}>Builders &amp; Contractors</a></li>
        <li><a href="/projects"{{nav_projects}}>Projects</a></li>
        <li><a href="/more-services"{{nav_more_services}}>More Services</a></li>
      </ul>
    </nav>
    <div class="hdr-social">
      {{fb_icon}}
      {{ig_icon}}
    </div>
    <a class="hdr-phone" href="{{phone_href}}" data-track="call">{{phone}}</a>
    <a class="btn hdr-cta" href="/estimate"{{nav_estimate}}>Get an Estimate</a>
    <a class="hdr-call" href="{{phone_href}}" data-track="call"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-phone"/></svg>Call</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="mmenu"><span class="menu-bars" aria-hidden="true"></span><span class="menu-label">Menu</span></button>
  </div>
  <div class="mmenu" id="mmenu" hidden>
    <a class="mmenu-call" href="{{phone_href}}" data-track="call"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-phone"/></svg>{{talk}} {{phone}}</a>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/homeowners">Homeowners</a></li>
      <li><a href="/builders">Builders &amp; Contractors</a></li>
      <li><a href="/projects">Projects</a></li>
      <li><a href="/more-services">More Services</a></li>
      <li><a href="/estimate">Get an Estimate</a></li>
    </ul>
    <div class="mmenu-foot">
      <div class="mmenu-social">
        {{fb_icon}}
        {{ig_icon}}
      </div>
    </div>
    <div class="dozer-spot" aria-hidden="true">{{> dozer}}</div>
  </div>
</header>
{{> icons}}
