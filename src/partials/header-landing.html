<!-- Ad landing pages: logo and phone only, no menu, so the visitor's only moves are call or the form. -->
<header class="hdr hdr-landing">
  <div class="hdr-in">
    <span class="hdr-logo"><img src="/assets/img/logo.png" alt="{{name}}" width="440" height="202"></span>
    <a class="hdr-phone hdr-phone-lp" href="{{phone_href}}" data-track="call"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-phone"/></svg>{{phone}}</a>
  </div>
</header>
{{> icons}}
