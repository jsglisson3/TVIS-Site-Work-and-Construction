<footer class="ftr ftr-landing">
  <div class="wrap ftr-lp-in">
    <p class="ftr-lp-name">{{name}}</p>
    <p>{{service_area}}</p>
    {{licensed}}
    <p><a href="{{phone_href}}" data-track="call">{{phone}}</a></p>
    <p class="ftr-lp-legal">&copy; <span data-year>{{year}}</span> {{name}}. {{tagline}}</p>
  </div>
</footer>
<nav class="mbar" aria-label="Quick contact">
  <a class="mbar-call" href="{{phone_href}}" data-track="call"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-phone"/></svg>Call</a>
  {{mbar_text}}
  <a class="mbar-est" href="#estimate">Get an Estimate</a>
</nav>
