<footer class="ftr ftr-landing" data-chapter="dark">
  <div class="wrap ftr-call">
    <p class="ftr-talk">{{talk}}</p>
    <a class="ftr-phone" href="{{phone_href}}" data-track="call">{{phone}}</a>
    <p class="ftr-alt">{{text_link}}<span>{{name}}</span><span>{{service_area}}</span></p>
    {{licensed}}
  </div>
  <div class="ftr-ground" data-ground aria-hidden="true">{{> dozer}}</div>
  <div class="wrap ftr-meta">
    <p class="ftr-legal">&copy; <span data-year>{{year}}</span> {{name}}. {{tagline}}</p>
  </div>
</footer>
<nav class="mbar" aria-label="Quick contact">
  <a class="mbar-call" href="{{phone_href}}" data-track="call"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-phone"/></svg>Call</a>
  {{mbar_text}}
  <a class="mbar-est" href="#estimate">Get an estimate</a>
</nav>
