<!-- What happens after an estimate request, printed like the slip it ends with. No promised times
     beyond site.config.json > responseTime. Used on the homepage, the estimate page and ad landing pages. -->
<div class="slip">
  <p class="slip-head"><b>{{name}}</b><span>Estimate request</span></p>
  <dl class="slip-rows">
    <div><dt>First</dt><dd><span>Send a few photos and a short description</span><b>you</b></dd></div>
    <div><dt>Next</dt><dd><span>We look them over and call to talk it through</span><b>TVIS</b></dd><dd><span>We visit the site if it needs a look</span><b>TVIS</b></dd></div>
    <div><dt>Then</dt><dd><span>You get an estimate for the work</span><b>you</b></dd></div>
  </dl>
  <p class="slip-total"><span>What you end up with</span><b>An estimate, and a crew that has seen the job</b></p>
</div>
