<!-- The TVIS mini excavator (Joey's new machine, 2026-11-04), side view, boom to the right, drawn in the dozer's style:
     the same flat olive shapes with charcoal cut-outs, the same charcoal nameplate with the orange TVIS letters, on the
     counterweight. Colours come from --dz (body) and --dz-dark (details) like the dozer's. The boom, stick and bucket are
     nested groups, each turning on its own pin (134,80 / 190,26 / 218.5,109.2 in the viewBox), so site.css can swing the
     arm with three rotations. In the footer it digs two buckets into the pile at its feet and swings them into the
     truck's bed (on phones, where there is no room for the truck, onto a spoil pile at `.ex-spoil`); elsewhere it rests
     with the bucket down. The ground line is y=128. -->
<svg class="exc" viewBox="0 0 300 128" aria-hidden="true" focusable="false">
  <!-- the pile it digs from: two mounds that sink a little with each bucket -->
  <g class="ex-pile" fill="var(--dz,#A3B654)">
    <path d="M174 128c10-12 20-18 31-18s22 6 31 18z" opacity=".55"/>
    <path d="M183 128c7-9 15-12 22-12s15 3 22 12z" opacity=".9"/>
  </g>
  <!-- the spoil pile (phones only): grows a step with each bucket, clods roll down its sides -->
  <g class="ex-spoil" fill="var(--dz,#A3B654)">
    <path d="M240 128c10-15 25-23 41-23s31 8 41 23z" opacity=".55"/>
    <path d="M248 128c8-10 20-16 33-16s25 6 33 16z" opacity=".9"/>
  </g>
  <g class="sp-bits" fill="var(--dz,#A3B654)">
    <circle class="sp-clod l" cx="276" cy="108" r="2.2"/><circle class="sp-clod r" cx="286" cy="108" r="2"/>
    <circle class="sp-clod l" cx="278" cy="102" r="2.4"/><circle class="sp-clod r" cx="284" cy="102" r="2.1"/>
  </g>
  <!-- the machine rides in one group so it can rock a hair on its tracks while it digs -->
  <g class="ex-rig">
  <g fill="var(--dz,#A3B654)">
    <!-- tracks -->
    <rect x="14" y="101" width="124" height="27" rx="13.5"/>
    <!-- front blade and its arm -->
    <path d="M116 105l32-3 1 7-32 3z"/>
    <path d="M145 96h8c4 9 6 19 6 29v3h-14z"/>
    <!-- house: counterweight at the rear, engine cover, boom post at the front -->
    <path d="M14 97V77c0-8 5-13 14-13h96l10 9v24z"/>
    <path d="M14 72c0-12 7-20 19-20h25v16H14z"/>
    <path d="M122 68h14l6 8v21h-20z"/>
    <!-- exhaust -->
    <rect x="22" y="44" width="5" height="10"/>
    <!-- canopy: roof and two posts, open sides like the real one -->
    <path d="M34 11h76l-3 7H37z"/>
    <path d="M40 64l3-47h6l-3 47z"/>
    <path d="M102 64l-4-47h-6l4 47z"/>
    <!-- seat and control lever -->
    <path d="M63 44h8v16h15v6H61z"/>
    <path d="M88 64l3-16h3l-3 16z"/>
  </g>
  <g fill="var(--dz-dark,#232B2E)">
    <!-- track belly, frame edge, grille slats, blade edge -->
    <rect x="22" y="108" width="108" height="13" rx="6.5"/>
    <rect x="40" y="97" width="84" height="4"/>
    <rect x="62" y="71" width="3" height="14"/><rect x="68" y="71" width="3" height="14"/><rect x="74" y="71" width="3" height="14"/>
    <rect x="145" y="124" width="14" height="4"/>
  </g>
  <g fill="var(--dz,#A3B654)">
    <circle cx="28" cy="114.5" r="9"/><circle cx="124" cy="114.5" r="8.5"/>
    <circle cx="51" cy="117" r="3.6"/><circle cx="71" cy="117" r="3.6"/><circle cx="91" cy="117" r="3.6"/><circle cx="109" cy="117" r="3.6"/>
  </g>
  <circle cx="28" cy="114.5" r="3.4" fill="var(--dz-dark,#232B2E)"/><circle cx="124" cy="114.5" r="3.2" fill="var(--dz-dark,#232B2E)"/>
  <!-- the TVIS nameplate on the counterweight: the dozer's plate, same size, same orange -->
  <rect class="ex-plate" x="19" y="73" width="38" height="17" fill="var(--dz-dark,#232B2E)"/>
  <text class="ex-badge" x="38" y="86.1" text-anchor="middle" font-family="Barlow Condensed, Barlow Condensed Fallback, Arial Narrow, Arial, sans-serif" font-weight="700" font-size="15" letter-spacing=".8" fill="#FF8200">TVIS</text>
  <!-- boom, stick and bucket: nested so each joint turns on its own pin -->
  <g class="ex-boom">
    <path d="M134 80C147 55 166 37 190 26" fill="none" stroke="var(--dz,#A3B654)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="134" cy="80" r="8.5" fill="var(--dz,#A3B654)"/>
    <path d="M147 66l26-28" stroke="var(--dz-dark,#232B2E)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="134" cy="80" r="3" fill="var(--dz-dark,#232B2E)"/>
    <g class="ex-stick">
      <path d="M186 14L218.5 109.2" stroke="var(--dz,#A3B654)" stroke-width="10" stroke-linecap="round"/>
      <path d="M194 42l17 50" stroke="var(--dz-dark,#232B2E)" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="190" cy="26" r="3" fill="var(--dz-dark,#232B2E)"/>
      <g class="ex-bucket">
        <g transform="translate(218.5 109.2) rotate(-19)">
          <!-- the dirt in the bucket: shown between the scoop and the dump -->
          <path class="ex-load" d="M-5-1C-15 0-21 9-18 17-16 22-13 26-11 27L-8 24C-6 15-5 7-5-1z" fill="var(--dz,#A3B654)" opacity=".72"/>
          <path d="M-5-3L5-5C15 0 19 12 15 22 12 28 4 31-4 31L-9 33-8 30-12 30-10 27-13 26-9 23C-6 15-5 6-5-3z" fill="var(--dz,#A3B654)"/>
          <circle r="2.6" fill="var(--dz-dark,#232B2E)"/>
        </g>
      </g>
    </g>
  </g>
  <!-- exhaust puffs while it works, then a faint idle puff now and then -->
  <g class="ex-smoke" fill="var(--dz,#A3B654)"><circle class="xpuff" cx="24.5" cy="40" r="3"/><circle class="xpuff" cx="24.5" cy="40" r="2.6"/><circle class="xpuff-idle" cx="24.5" cy="41" r="2.4"/></g>
  <!-- clods kicked up when the bucket bites into the pile -->
  <g class="ex-kick" fill="var(--dz,#A3B654)"><circle cx="212" cy="114" r="2"/><circle cx="219" cy="116" r="1.7"/><circle cx="207" cy="113" r="1.5"/></g>
  </g>
  <!-- dirt falling from the bucket: into the truck's bed (desktop) or onto the spoil pile (phones) -->
  <g class="ex-drop" fill="var(--dz,#A3B654)"><circle cx="290" cy="38" r="2.6"/><circle cx="297" cy="35" r="2.1"/><circle cx="284" cy="36" r="1.9"/><circle cx="293" cy="41" r="1.8"/></g>
</svg>
